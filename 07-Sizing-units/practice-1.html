<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizing units Practice-1 | Web Development</title>
    <style>
        .header{
            height:50px;
            width: 80%;
            margin:10px auto;
            background-color: lightblue;
        }

        .main{
            height: 300px;
            min-height: 90vh;
            width: 80%;
            margin: 10px auto;
            background-color: lightgreen;
        }

        .footer{
            height: 150px;
            width: 80%;
            margin: 10px auto;
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <!-- CSS Sizing Units Practice-1 -->

    <div class="header">
        header
    </div>

    <div class="main">
        main
    </div>

    <div class="footer">
        footer
    </div>
</body>
</html>
