<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property Practice | Web Development</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .navbar {
            background-color: brown;
            width: 80%;
            height: 20px;

        }


        /* display inline */
        .navbar a {
            width: 50px;
            height: 100px;
            display: inline;
            background-color: green;
            padding: 10px;
            border-radius: 5px;
            /* display inline use karva thi margin-top, padding-top, height-width no use thai sakto nathi */
        }


        /* display inlinr-block */
        .navbar2 a {
            width: 100px;
            height: 100px;
            display: inline-block;
            background-color: green;
            padding: 30px;
            border-radius: 5px;
            /* display inline-block use karva thi margin-top, padding-top, height-width no use kari sakai chhe */
        }


        /* display block property mate */
        .container {
            background-color: brown;
        }

        .container .box {
            display: block;
            width: 50px;
            height: 40px;
            border: 1px solid black;
            padding: 10px 20px;
            background-color: green;
            /* display block propety use karvathi darek box new line ma aavse, ek bija ni baju ma nahi aavi sake & height-width no use kari sakai chhe */
        }

        
        .offer{
            display: none;
            background-color: brown;
            width: 50px;
            height: 50px;
            /* display none use karva thi text nathi show thata & teni jagya  */
        }
    </style>
</head>

<body>
    <header>
        <!-- Display inline -->
        <div class="navbar">
            <a href="">Home</a>
            <a href="">Products</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </div><br>
        <hr><br>

        <!-- Display inline -->
        <div class="navbar2">
            <a href="">Home</a>
            <a href="">Products</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </div>
    </header><br>
    <hr><br>

    <main>
        <!-- Display Block -->
        <div class="container">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
        </div>


        <!-- Display none -->
        <p class="offer">
            Special Offer : 20% Off
        </p>
    </main>
</body>

</html>
