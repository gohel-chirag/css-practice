<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow & Border Property Practice | Web Development</title>
    <style>
        .card{
            width:300px;
            margin:20px auto;
            border: 1px solid grey;
            border-radius: 20px;
            box-shadow: 0px 0px 10px grey;
        }
        .card h2{
            text-align: center;
        }
        .card p{
            line-height: 15px;
            font-family: monospace;
            padding: 10px 20px;
        }
        .card button{
            width: 90%;
            padding: 8px 10px;
            margin: 0px 5% 15px 5%;
            border:1px solid black;
            border-radius: 20px;
            box-shadow: 0px 0px 10px grey;
            background-color: white;
            color:black;
            transition: .3s;
        }
        .card button:hover{
            color:white;
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Rolex Watch</h2>
        <p>Premium Luxury Watch | Lorem ipsum dolor sit amet consectetur adipisicing elit. Reiciendis </p>
        <button>View Details</button>
    </div>
</body>

</html>
