<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property Practice | Web Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #E3FDFD;
            color: black;
        }

        .navbar {
            width: 100%;
            height: 40px;
            border: 1px solid black;
            position: sticky;
            box-shadow: 0px 0px 5px black;
            top: 0px;
        }

        .navbar ul {
            display: flex;
            list-style: none;
            margin: 10px;
        }

        .navbar ul li a {
            text-decoration: none;
            padding: 5px 15px;
            margin: 5px;
            /* border: 1px solid grey; */
        }


        .card {
            width: 300px;
            height: 450px;
            border: 1px solid grey;
            border-radius: 20px;
            position: relative;
            top: 30px;
        }

        .card .watch-img{
            width: 100%;
            height: auto;
            border-radius: 20px 20px 0px 0px;
            margin-bottom: 5px;
        }
        .card span{
            padding: 2px 10px;
            font-size: 13px;
            border-radius: 20px;
            margin-right: 5px;
            border:1px solid grey;
        }
        .card h2{
            position: relative;
            margin-top: 10px;
            bottom: 5px;
        }
        .card .badge{
            border: 1px solid grey;
            position: absolute;
            top:10px;
            right: 5px;
        }
        .card button{
            width: 80%;
            border: 1px solid grey;
            border-radius: 20px;
            padding: 5px 20px;
            margin: 30px;
            background-color: #E3FDFD;
            box-shadow: 0px 0px 2px grey;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#favorites">Favorites</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>

    <div class="card">
        <div class="watch-img">
            <img class="watch-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNhB_YR4DWts6Z8aYyvlvVAPuwttjX5mbnUaCFvdmjTQ&s=10"
                alt="Watch">
        </div>
        <span class="badge">New</span>
        <h2>Rolex Watch</h2>
        <p>₹2,80,000</p>
        <button type="submit">🛒 Cart</button>
    </div>
</body>

</html>
