<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flex Box Practice | Web Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 90vw;
            margin: 10px auto;
            padding: 20px;
            border: 1px solid grey;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            width: 30%;
            height: 200px;
            padding: 20px;
            margin: 0px auto;
            text-align: center;
            border: 1px solid grey;
        }

        .card button {
            padding: 3px 10px;
            border-radius: 15px;
        }

        @media screen and (max-width:924px) {
            .container {
                width: 90%;
                flex-wrap: wrap;
            }

            .card {
                width: 40%;
                height: 200px;
                margin: 0px auto;
                
            }
        }

        @media screen and (max-width:600px) {
            .container {
                width: 90%;
                flex-direction: column;
            }

            .card {
                width: 100%;
                height: 200px;
                margin: 0px auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>Rolex</h2>
            <p>₹2,50,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Omega</h2>
            <p>₹1,80,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Seiko</h2>
            <p>₹50,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Titan</h2>
            <p>₹50,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Casio</h2>
            <p>₹50,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Rado</h2>
            <p>₹50,000</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>

</html>
