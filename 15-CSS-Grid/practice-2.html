<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Practice-2 | Web Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 90%;
            padding: 30px;
            border: 1px solid red;
            display: flex;
            margin: 0 auto;
            gap: 30px;
        }

        .card {
            width: 300px;
            height: 300px;
            border: 1px solid;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* For Mobile */
        @media (max-width:426px) {
            .container {
                flex-wrap: wrap;
            }
        }

        /* For Tablet */
        @media (max-width:769px) {
            .container {
                width: 90%;
                margin: 0 auto;
                flex-wrap: wrap;
                column-gap: 30px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
    </div>
</body>

</html>
