<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Practice-2 | Web Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 90%;
            background-color: #8D84D6;
            border: 1px solid black;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin: 20px auto;
            padding: 30px;
            text-align: center;
            gap: 20px;
        }

        .card {
            height: 200px;
            background-color: #D6E6F2;
            border: 1px solid;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* For Mobile */
        @media (max-width:426px) {
            .container {
                grid-template-columns: repeat(1, 1fr);
            }
        }

        /* For Tablet */
        @media (min-width:427px) and (max-width:769px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
        <div class="card">
            <h1>Card</h1>
        </div>
    </div>
</body>

</html>
