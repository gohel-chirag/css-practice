<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform Property Practice | Web Development</title>
    <style>
        body{
            background-color: #F2F7F8;
        }
        .box{
            width: 200px;
            height: 200px;
            margin: 50px auto;
            text-align: center;
            border: 5px solid black;
            border-radius: 50%;
            background-color: #8D84D6;
        }
        .box-1:hover{
            transform: scale(1.3);
        }
        .box-2{
            border-top:5px solid red;
        }
        .box-2:hover{
            border-top: 5px solid red;
            transform: rotate(90deg);
        }
        .box-3:hover{
            transform: skew(40deg);
        }
        .box-4{
            border-top: 5px solid red;
        }
        .box-4:hover{
            border-top: 5px solid red;
            transform: scale(1.2) rotate(90deg) skew(20deg);
        }
        
    </style>
</head>
<body>
    <div class="box box-1"><h2>Scale</h2></div>
    <div class="box box-2"><h2>Rotate</h2></div>
    <div class="box box-3"><h2>Skew</h2></div>
    <div class="box box-4"><h2>Multiple</h2></div>
</body>
</html>
