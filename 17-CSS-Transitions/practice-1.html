<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions Practice | Web Development</title>
    <style>
        .container {
            /* height: 50vh; */
            width: 50vw;
            background-color: #0F1E3A;
            margin: 30px auto;
            padding: 50px;
            box-shadow: 0px 0px 5px black;
            border-radius: 15px;
        }
        .box1, .box2, .box3, .box4, .box5, .box6{
            cursor: pointer;
        }
        h1{
            margin: 0;
            color: #FFFFFF;
            text-align: center;
        }

        /* box 1 Translate */
        .box1{
            height: 100px;
            width: 100px;
            border: 2px solid #FFFFFF;
            border-radius: 10px;
            background-color: #A7B6D0;
            margin: 40px auto;
            transition: transform 2s ease-in-out;
            box-shadow: 0px 0px 20px white;
        }
        .box1:hover{
            transform: translateX(100px);
        }

        /* box 2 Rotate */
        .box2{
            height: 100px;
            width: 100px;
            border: 2px solid #FFFFFF;
            border-radius: 10px;
            background-color: #A7B6D0;
            margin: 40px auto;
            transition: transform 2s ease-in-out;
            box-shadow: 0px 0px 20px white;
        }
        .box2:hover{
            transform: rotate(300deg);
        }

        /* box 3 Rotate X */
        .box3{
            height: 100px;
            width: 100px;
            border: 2px solid #FFFFFF;
            border-radius: 10px;
            background-color: #A7B6D0;
            margin: 40px auto;
            transition: transform 2s ease-in-out;
            box-shadow: 0px 0px 20px white;
        }
        .box3:hover{
            transform: rotateX(300deg);
        }

        /* box 4 Rotate Y */
        .box4{
            height: 100px;
            width: 100px;
            border: 2px solid #FFFFFF;
            border-radius: 10px;
            background-color: #A7B6D0;
            margin: 40px auto;
            transition: transform 2s ease-in-out;
            box-shadow: 0px 0px 20px white;
        }
        .box4:hover{
            transform: rotateY(300deg);
        }

        /* box 5 Scale */
        .box5{
            height: 100px;
            width: 100px;
            border: 2px solid #FFFFFF;
            border-radius: 10px;
            background-color: #A7B6D0;
            margin: 40px auto;
            transition: transform 2s ease-in-out;
            box-shadow: 0px 0px 20px white;
        }
        .box5:hover{
            transform: scale(1.3);
        }

        /* box 6 Scale */
        .box6{
            height: 100px;
            width: 100px;
            border: 2px solid #FFFFFF;
            border-radius: 10px;
            background-color: #A7B6D0;
            margin: 40px auto;
            transition: transform 2s ease-in-out;
            box-shadow: 0px 0px 20px white;
        }
        .box6:hover{
            transform: scale(0.7);
        }

        /* box 7 Translate Y */
        .box7{
            height: 100px;
            width: 100px;
            border: 2px solid #FFFFFF;
            border-radius: 10px;
            background-color: #A7B6D0;
            margin: 40px auto;
            transition: transform 2s ease-in-out;
            box-shadow: 0px 0px 20px white;
        }
        .box7:hover{
            transform: translateY(70px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSS Transitions Practice</h1>
        
        <div class="box1"></div>
        <!-- Box 1: Translate X 100px -->
         
        <div class="box2"></div> 
        <!-- transform: rotate(300deg); -->

        <div class="box3"></div>
        <!-- transform: rotateX(300deg); -->

        <div class="box4"></div>
        <!-- transform: rotateY(300deg); -->

        <div class="box5"></div>
        <!-- transform: scale(1.3); -->

        <div class="box6"></div>
        <!-- transform: scale(0.7); -->

        <div class="box7"></div>
        <!-- transform: translateY(70px); -->
        
    </div>
</body>
</html>
