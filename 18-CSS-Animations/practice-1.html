<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Practice | Web Development</title>
    <style>
        body{
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
        }

        .container{
            width: 300px;
            height: 300px;
            background-color: #F3E9DD;
            border: 2px solid black;
            margin: 50px auto;
        }

        .box, .box-2, .box-3, .box-4{
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
        }


        /* Linear Animation */
        .box{
            width: 100px;
            height: 100px;
            background-color: #A67C52;
            animation: move 5s linear infinite;
        }

        /* Ease Animation */
        .box-2{
            width: 100px;
            height: 100px;
            background-color: #A67C52;
            animation: move 5s ease infinite;
        }
        
        /* Ease-in Animation */
        .box-3{
            width: 100px;
            height: 100px;
            background-color: #A67C52;
            animation: move  5s ease-in infinite;
        }
        
        /* Ease-in-out Animation */
        .box-4{
            width: 100px;
            height: 100px;
            background-color: #A67C52;
            animation: move 5s ease-in-out infinite;
        }
        
        @keyframes move{
            0%{
                transform: translate(0, 0);
            }
            25%{
                transform: translate(200px, 0);
            }
            50%{
                transform: translate(200px, 200px);
            }
            75%{
                transform: translate(0, 200px);
            }
            100%{
                transform: translate(0, 0); 
            }
        }
        </style>
</head>
<body>
    <div class="container">
        <div class="box"><h2>Linear</h2>
        </div>
    </div>
    <div class="container">
        <div class="box-2"><h2>Ease</h2></div>
    </div>
    <div class="container">
        <div class="box-3"><h2>Ease-In</h2></div>
    </div>
    <div class="container">
        <div class="box-4"><h3>Ease-In-Out</h3></div>
</body>
</html>
