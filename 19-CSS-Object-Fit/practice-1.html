<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Object Fit Practice | Web Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }


        /* Cards Container */

        .watch-container {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }


        /* Product Card */

        .watch-card {
            width: 300px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }


        /* Image */
        .img {
            width: 100%;
            height: 220px;
        }


        /* Step 1 - Cover */
        .cover {
            object-fit: cover;
        }


        /* Step 2 - Contain */
        .contain {
            object-fit: contain;
        }


        /* Step 3 - Fill */
        .fill {
            object-fit: fill;
        }


        /* Card Information */
        .watch-info {
            padding: 20px;
        }

        .watch-info h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            background-color: #111;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c9a227;
        }
    </style>
</head>

<body>
    <h1>Watch Collection</h1>

    <div class="watch-container">

        <!-- Card 1 -->
        <div class="watch-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSrc6D8BCUwCobInKc3W1wgkPXYADjaDb7NgJKBJm8Aag&s=10" alt="watch-1" class="online img cover">
            <div class="watch-info">
                <h2>Rolex Style Watch</h2>
                <p class="price">₹25,000</p>
                <button>View Details</button>
            </div>
        </div>


        <!-- Card 2 -->
        <div class="watch-card">
            <img src="https://picsum.photos/200/300" alt="watch-2" class="img contain">
            <div class="online-image">
                <h2>Luxury Gold Watch</h2>
                <p class="price">₹35,000</p>
                <button>View Details</button>
            </div>
        </div>


        <!-- Card 3 -->
        <div class="watch-card">
            <img src="https://picsum.photos/200/300" alt="online image" class="img fill">
            <div class="online-image">
                <h2>Premium Black Watch</h2>
                <p class="price">₹45,000</p>
                <button>View Details</button>
            </div>
        </div>

    </div>
</body>

</html>
