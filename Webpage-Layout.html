<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Layout | Web Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            padding: 16px;
            color: white;
        }

        /* Header Section */
        header {
            position: sticky;
            top: 0;
        }

        nav {
            height: 70px;
            background-color: #2B2B2B;
            border-bottom: 2px solid white;
            box-shadow: 5px 10px 10px black;
        }

        /* Main Section */
        .container {
            width: 97%;
            height: 100vh;
            margin: 10px auto;
            display: flex;
            background-color: #000000;
        }

        .box {
            width: 45%;
            height: 90%;
            margin: 50px auto;
            background-color: #2B2B2B;
            border: 1px solid white;
        }

        /* Footer Section */
        .footer {
            height: 400px;
            border-top: 5px solid black;
            background-color: #2B2B2B;
        }

        .back-to-top {
            height: 60px;
            width: 60px;
            border: 4px solid black;
            border-radius: 50%;
            background-color: white;
            position: fixed;
            bottom: 30px;
            right: 30px;
            box-shadow: 0px 0px 15px black;
        }


        /* Responsiveness */
        /* Mobile */
        @media (max-width:500px) {
            .container {
                display: flex;
                flex-direction: column;
            }

            .box {
                width: 85%;
                margin: 15px auto;
            }

            .footer {
                height: 200px;
            }

            .back-to-top {
                height: 50px;
                width: 50px;
                position: fixed;
                bottom: 10px;
                right: 10px;
            }
        }

        /* Tablet */
        @media (min-width:501px) and (max-width:769px) {
            .container {
                height: 70vh;
            }

            .box {
                width: 45%;
                height: 95%;
                margin: 10px auto;
            }

            .footer {
                height: 300px;
            }

            .back-to-top {
                height: 50px;
                width: 50px;
                position: fixed;
                bottom: 15px;
                right: 15px;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <h1>Navbar</h1>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </main>
    <footer>
        <div class="footer">
            <h1>Footer</h1>
        </div>
    </footer>
    <div class="back-to-top">
    </div>
</body>

</html>
