<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice-1 CSS | Web development</title>
    <style>
        /* for all elements  */
        *{
            margin: 0;
            padding: 0;
            background-color: #F5F5F5;
        }

        /* for watch card */
        .watch-card{
            width: 500px;
            height: auto;
            padding: 20px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 15px;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 600;
            text-transform: lowercase;
            line-height: 1.5;
            color: #111111;
            background-color: #f9f9f9;
        }

        /* watch card image */
        .watch-card img{ 
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        /* watch heading */
        .watch-card h2{
            text-align: center;
            margin: 10px;
            text-transform: uppercase;
        }

        /* watch description */
        .watch-card p{
            color: #4d4d4d;
        }

        /* watch price */
        .watch-card .watch-price{
            margin-top: 30px;
        }

        .watch-card .watch-price span{
            color: #000000;
        }

        /* watch card buttons */
        .watch-card .watch-price button{
            width: 50%;
            margin: auto;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #111111;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- heading -->
    <h1 style="text-align: center; margin: 20px;">Watch Card</h1>

    <!-- Watch Card Task -->
    <div class="watch-card">
        <!-- Online Image -->
        <img src="https://cdn.watchtime.com/watchtime_en-us/2025/03/0b0c9f585b11d0f1a3cc_640.webp" alt="Watch Image">

        <!-- heading -->
        <h2>Audemars Piguet</h2>

        <p>Audemars Piguet Code 11.59 Universelle is Ultra-luxury Swiss masterpiece with a flying tourbillon, perpetual calendar, advanced chronograph, and intricate automatic movement—crafted for elite collectors seeking exclusivity and timeless elegance.</p>

        <!-- price & button -->
        <div class="watch-price">
            <span style="margin-right: 120px;">₹15,00,00,000</span>
            <button type="submit">Add to Cart</button>
        </div>
    </div>
    
    
</body>
</html>
