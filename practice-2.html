<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice-2 CSS | Web development</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: #0F172A;
        }

        .profile-card{
            width: 400px;
            padding: 30px;
            margin: 40px auto;
            color:#FFFFFF;
            border:1px solid #E2E8F0;
            border-radius: 15px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: capitalize;
            line-height: 1.5;
            letter-spacing: 0.5px;
            background-color: #1E293B;
        }

        .profile-card img{
            width: 150px;
            height: auto;
            border-radius: 50%;
            margin: auto 120px;
        }

        .profile-card h1,h2{
            text-align: center;
            background-color: #1E293B;
        }

        .profile-card button{
            background-color: #2563EB;
            color: #FFFFFF;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            margin: auto 120px;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin: 20px; color:white;">Profile Card</h1>
    
    <div class="profile-card">
        <img src="https://avatars.githubusercontent.com/u/308851321?v=4" alt="Chirag Gohel Profile Picture">

        <h1>Chirag Gohel</h1>
        <h2 style="color:#2563EB; background-color: #1E293B;">Web Developer</h2><br>
        <p style="color:#64748B; background-color: #1E293B;">I am learning web development and building practical projects. Lorem ipsum dolor sit amet, consectetur adipisicing elit. Accusamus deleniti provident rerum perferendis.</p>
        <span style="color:white;  background-color: #1E293B;">HTML • CSS • Bootstrap • PHP</span><br><br>
        <button type="submit">Visit Profile</button>
    </div>

</body>
</html>
